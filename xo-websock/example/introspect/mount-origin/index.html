<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>xo-websock introspect</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5em; color: #222; }
    #status { color: #666; margin-left: 0.8em; }
    #srcinfo { color: #666; font-size: 13px; margin-top: 0.4em; }
    svg { border: 1px solid #ccc; background: #fafafa; margin-top: 1em; display: block; }
    .node rect { stroke-width: 1.5px; rx: 6px; }
    .node.server rect { fill: #e8f0fe; stroke: #4a6fa5; }
    .node.http rect   { fill: #fdf3e1; stroke: #b07d2b; }
    .node.stream rect { fill: #e7f5ea; stroke: #3c8a4f; }
    .node.session rect { fill: #f3e8fb; stroke: #7a4fa0; }
    .node.closed rect  { stroke-dasharray: 4 3; opacity: 0.6; }
    .node.subscription rect { fill: #fff; stroke: #7a4fa0; }
    .node.sender rect { fill: #fdf6e3; stroke: #8a7a3a; }
    .node.astray rect { stroke: #c0392b; stroke-width: 2.5px; }
    .node.sender text { font-size: 12px; }
    .node.subscription text { font-size: 12px; }
    g.badge circle { fill: #fff; stroke: #555; stroke-width: 1.2px; }
    g.badge text { font-size: 11px; font-family: ui-monospace, monospace; fill: #333; }
    g.badge.unaccounted circle { fill: #fde2e0; stroke: #c0392b; stroke-width: 2px; }
    .node.app rect { fill: #eef6fb; stroke: #2c6e8f; stroke-dasharray: 5 3; }
    path.holds { fill: none; stroke: #d08a2c; stroke-width: 1.4px; stroke-dasharray: 2 3; }
    path.uses { fill: none; stroke: #3c8a4f; stroke-width: 1.4px; stroke-dasharray: 5 3; opacity: 0.8; }
    .node text { font-size: 14px; font-family: ui-monospace, monospace; }
    .node.linked { cursor: pointer; }
    .node.linked:hover rect { stroke-width: 3px; }
    .node:focus { outline: none; }
    .node:focus rect { stroke-width: 3px; stroke-dasharray: 3 2; }
    #ctxmenu { position: absolute; z-index: 10; min-width: 12em; background: #fff;
               border: 1px solid #bbb; border-radius: 6px; padding: 4px 0;
               box-shadow: 0 4px 14px rgba(0,0,0,0.18); font-size: 13px; }
    #ctxmenu .ctxhead { padding: 4px 12px 6px; color: #666; font-family: ui-monospace, monospace;
                        font-size: 12px; border-bottom: 1px solid #eee; margin-bottom: 3px; }
    #ctxmenu button { display: block; width: 100%; text-align: left; border: 0; background: none;
                      padding: 5px 12px; font: inherit; cursor: pointer; }
    #ctxmenu button:hover:enabled, #ctxmenu button:focus { background: #e8f0fe; outline: none; }
    #ctxmenu button:disabled { color: #aaa; cursor: default; }
    text.heading { font-size: 13px; fill: #666; }
    line.link { stroke: #999; stroke-width: 1.2px; }
    pre { background: #f4f4f4; padding: 0.8em; max-width: 60em; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>xo-websock introspect</h1>
  <div>
    <button id="refresh" disabled>Refresh</button>
    <span id="status">connecting...</span>
  </div>
  <div id="srcinfo">source links: (loading)</div>

  <svg id="graph" width="900" height="160"></svg>

  <div id="ctxmenu" role="menu" hidden></div>

  <h3 id="detail-h" hidden></h3>
  <pre id="detail" hidden></pre>

  <h3>last frame</h3>
  <pre id="raw">(none yet)</pre>

  <script src="introspect.js"></script>
</body>
</html>
