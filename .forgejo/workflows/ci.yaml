          echo nix-build ci.nix -A xo-timeutil -o "$XO_GCROOTS/xo-timeutil"
          nix-build ci.nix -A xo-timeutil -o "$XO_GCROOTS/xo-timeutil"
          ls -l "$XO_GCROOTS/xo-timeutil"

      - name: build xo-ppsink
