name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  smoke-test:
    runs-on: host

    # One persistent gc root per subsystem, kept OUTSIDE the per-run workspace.
    #
    # Each build step used to write ./result in the workspace, which act recreates for
    # every run, and each step overwrote the previous one's symlink.  So between runs
    # exactly one output stayed rooted -- whichever subsystem happened to run last --
    # and a nix-collect-garbage evicted all the others, making the next run rebuild the
    # whole set from source.
    #
    # Rooting each subsystem separately keeps unchanged subsystems cached across a GC.
    # A run replaces its own symlinks, so at most one closure per subsystem is retained.
    # Deleting this directory is safe: it costs a rebuild, nothing else.
    #
    # Location: the runner's own state dir.  It survives between runs, the runner owns
    # it (no root, no fleet-repo provisioning), and the repo-named subdirectory leaves
    # room for other repos to do the same.
    env:
      XO_GCROOTS: /var/lib/forgejo-runner/gcroots/xo-umbrella2

    steps:

      - name: debug env
        run:
          env | sort

      - name: Setup PATH
        run: |
          echo "/nix/var/nix/profiles/default/bin" >> $GITHUB_PATH
          echo "/var/lib/forgejo-runner/.nix-profile/bin" >> $GITHUB_PATH

      - name: Check PATH
        run:
          echo $PATH

      - name: Check cwd
        run:
          pwd

      - name: Check nix version
        run:
          echo $(nix --version)

      - name: nix store ping
        run:
          nix store info

      - name: checkout
        run: |
          # 1. actions/checkout@v4 stumbles b/c install is at conybeare.us/git
          #    checkout manually instead.
          # 2. could clone from /var/lib/forgejo/gitea-repositories/roland/xo-umbrella2.git
          # 3. instead rely on $GITHUB_SERVER_URL

          git clone --quiet --depth=1 $GITHUB_SERVER_URL/roland/xo-umbrella2.git .

      - name: prepare gc roots
        run: |
          mkdir -p "$XO_GCROOTS"
          # What survived the last gc, and therefore what this run can reuse.
          echo "retained from previous runs: $(ls "$XO_GCROOTS" | wc -l) subsystems"

      - name: build xo-cmake
        run: |
          echo nix-build ci.nix -A xo-cmake -o "$XO_GCROOTS/xo-cmake"
          nix-build ci.nix -A xo-cmake -o "$XO_GCROOTS/xo-cmake"
          ls -l "$XO_GCROOTS/xo-cmake"

      - name: build xo-timeutil
